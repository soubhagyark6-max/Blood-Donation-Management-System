<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Audit log')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('audit')}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>
<main class="container pb-4">
  <div class="page-head"><div><h1>Audit log</h1><div class="sub">Latest 100 important actions (registrations, status changes, stock and user changes).</div></div></div>
  <div class="card-ll"><div class="table-responsive"><table class="table table-ll align-middle">
    <thead><tr><th>When</th><th>Actor</th><th>Action</th><th>Details</th></tr></thead>
    <tbody>
      <tr th:each="l : ${logs}"><td th:text="${#temporals.format(l.createdAt, 'dd MMM yyyy HH:mm:ss')}">w</td><td th:text="${l.actor}">a</td>
        <td><span class="badge-soft primary" th:text="${l.action}">act</span></td><td class="small" th:text="${l.details}">d</td></tr>
      <tr th:if="${logs.isEmpty()}"><td colspan="4" class="text-center text-muted py-4">No entries yet.</td></tr>
    </tbody></table></div></div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
