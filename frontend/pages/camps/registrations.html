<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Camp registrations')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('camps')}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>
<main class="container pb-4">
  <div class="page-head"><div><h1 th:text="${camp.name}">Camp</h1>
    <div class="sub"><span th:text="${camp.campDate}">d</span> &middot; <span th:text="${camp.venue + ', ' + camp.city}">v</span></div></div>
    <div class="d-flex gap-2 no-print"><a class="btn btn-outline-secondary" th:href="@{/camps}"><i class="bi bi-arrow-left"></i> Camps</a>
      <button class="btn btn-outline-secondary" data-print><i class="bi bi-printer"></i> Print list</button></div></div>
  <div class="card-ll"><div class="table-responsive"><table class="table table-ll align-middle">
    <thead><tr><th>Reference</th><th>Donor</th><th>Group</th><th>Phone</th><th>Booked</th><th>Status</th><th class="no-print"></th></tr></thead>
    <tbody>
      <tr th:each="a : ${appointments}">
        <td><code th:text="${a.reference}">LL-X</code></td>
        <td th:text="${a.donor.fullName}">n</td>
        <td><span class="blood-pill" th:text="${a.donor.bloodGroup.label}">A+</span></td>
        <td th:text="${a.donor.phone}">p</td>
        <td th:text="${#temporals.format(a.bookedAt, 'dd MMM HH:mm')}">b</td>
        <td><span class="badge-soft" th:classappend="${a.status.badge}" th:text="${a.status.label}">s</span></td>
        <td class="text-end no-print" th:if="${a.status.name() == 'BOOKED'}">
          <form class="d-inline" th:action="@{/appointments/{id}/mark(id=${a.id})}" method="post"><input type="hidden" name="status" value="COMPLETED"><button class="btn btn-sm btn-outline-success">Attended</button></form>
          <form class="d-inline" th:action="@{/appointments/{id}/mark(id=${a.id})}" method="post"><input type="hidden" name="status" value="NO_SHOW"><button class="btn btn-sm btn-outline-secondary">No show</button></form>
          <form class="d-inline" th:action="@{/appointments/{id}/cancel(id=${a.id})}" method="post" data-confirm="Cancel this appointment?"><button class="btn btn-sm btn-outline-danger">Cancel</button></form>
        </td>
        <td th:unless="${a.status.name() == 'BOOKED'}" class="no-print"></td>
      </tr>
      <tr th:if="${appointments.isEmpty()}"><td colspan="7" class="text-center text-muted py-4">Nobody has registered yet.</td></tr>
    </tbody></table></div></div>
  <p class="small text-muted mt-2">After an attended donation, record it on the donor's page so that stock and history are updated.</p>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
