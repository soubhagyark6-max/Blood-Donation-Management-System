<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Dashboard')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('dashboard')}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>
<main class="container pb-4">
  <div class="page-head"><div><h1>Hello, <span th:text="${currentUser.fullName}">User</span></h1><div class="sub">Your blood request overview</div></div>
    <a class="btn btn-ll" th:href="@{/requests/new}"><i class="bi bi-plus-circle"></i> New blood request</a></div>
  <div class="row g-3">
    <div class="col-6 col-lg-3"><div class="stat-card navy"><div class="d-flex justify-content-between align-items-center"><div><div class="stat-value" th:text="${d.total}">0</div><div class="stat-label">My requests</div></div><div class="stat-icon"><i class="bi bi-clipboard2-pulse"></i></div></div></div></div>
    <div class="col-6 col-lg-3"><div class="stat-card amber"><div class="d-flex justify-content-between align-items-center"><div><div class="stat-value" th:text="${d.pending}">0</div><div class="stat-label">Pending</div></div><div class="stat-icon"><i class="bi bi-hourglass-split"></i></div></div></div></div>
    <div class="col-6 col-lg-3"><div class="stat-card"><div class="d-flex justify-content-between align-items-center"><div><div class="stat-value" th:text="${d.approved}">0</div><div class="stat-label">Approved</div></div><div class="stat-icon"><i class="bi bi-patch-check"></i></div></div></div></div>
    <div class="col-6 col-lg-3"><div class="stat-card green"><div class="d-flex justify-content-between align-items-center"><div><div class="stat-value" th:text="${d.fulfilled}">0</div><div class="stat-label">Fulfilled</div></div><div class="stat-icon"><i class="bi bi-check2-circle"></i></div></div></div></div>
  </div>
  <div class="row g-3 mt-1">
    <div class="col-lg-4"><div class="card-ll h-100"><div class="card-header-ll">My requests by status</div><div class="p-3"><div class="chart-box"><canvas id="chStatus" aria-label="Requests by status"></canvas></div></div></div></div>
    <div class="col-lg-8"><div class="card-ll h-100"><div class="card-header-ll">Recent requests <a class="btn btn-sm btn-outline-ll" th:href="@{/requests}">All</a></div>
      <div class="table-responsive"><table class="table table-ll">
        <thead><tr><th>#</th><th>Group</th><th>Component</th><th>Units</th><th>Hospital</th><th>Status</th></tr></thead>
        <tbody>
          <tr th:each="r, st : ${d.recent}" th:if="${st.index < 6}" th:classappend="${r.urgency.name() == 'EMERGENCY' and r.status.open} ? 'row-emergency'">
            <td><a th:href="@{/requests/{id}(id=${r.id})}" th:text="'#' + ${r.id}">#1</a></td>
            <td><span class="blood-pill" th:text="${r.bloodGroup.label}">A+</span></td>
            <td th:text="${r.component.label}">c</td><td th:text="${r.units}">1</td><td th:text="${r.hospital}">h</td>
            <td><span class="badge-soft" th:classappend="${r.status.badge}" th:text="${r.status.label}">s</span></td>
          </tr>
          <tr th:if="${d.recent.isEmpty()}"><td colspan="6" class="text-center text-muted py-4">You have not made any request yet.</td></tr>
        </tbody></table></div></div></div>
  </div>
  <div class="notice warn mt-3"><i class="bi bi-shield-check"></i> <span th:text="#{common.disclaimer}">Disclaimer</span></div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script th:inline="javascript">
  /*<![CDATA[*/
  var statusLabels = /*[[${d.statusLabels}]]*/ [];
  var statusValues = /*[[${d.statusValues}]]*/ [];
  /*]]>*/
  LL.chart('chStatus', { type: 'doughnut', data: { labels: statusLabels, datasets: [{ data: statusValues, backgroundColor: ['#f0a30a', '#0b8aa4', '#123862', '#1b9e5a', '#c8102e', '#9aa7b8'] }] },
    options: { plugins: { legend: { position: 'bottom' } }, cutout: '60%' } });
</script>
</body>
</html>
