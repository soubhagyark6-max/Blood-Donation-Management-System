# Test configuration: in-memory H2 (MySQL mode) so tests need no MySQL server.
spring.application.name=LifeLink-test
spring.datasource.url=jdbc:h2:mem:lifelinktest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.thymeleaf.cache=false
spring.messages.basename=messages
spring.messages.encoding=UTF-8
lifelink.demo-data.enabled=false
lifelink.low-stock-threshold=5
lifelink.expiry-alert-days=7
lifelink.donation-interval-days=90
