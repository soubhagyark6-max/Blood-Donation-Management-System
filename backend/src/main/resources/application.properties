# ============================================================
# LifeLink - application configuration
# Every secret/setting can be overridden with an environment variable
# or by copying .env.example to .env (loaded automatically below).
# ============================================================
spring.application.name=LifeLink
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ---------- Database (MySQL 8) ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lifelink?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=Soubhu@123

# update = Hibernate creates/updates tables automatically on first run.
# Use "validate" or "none" in production after running database/schema.sql.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false

# ---------- Thymeleaf / i18n ----------
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# ---------- LifeLink business settings ----------
# Demo data (labelled as DEMO in the UI). Set DEMO_DATA_ENABLED=false for a clean database.
lifelink.demo-data.enabled=${DEMO_DATA_ENABLED:true}
# Password given to the demo accounts. Change it via the DEMO_PASSWORD environment variable.
lifelink.demo-data.password=${DEMO_PASSWORD:Demo@12345}
# A blood group/component combination with fewer units than this is flagged as low stock.
lifelink.low-stock-threshold=${LOW_STOCK_THRESHOLD:5}
# Units expiring within this many days raise an expiry alert.
lifelink.expiry-alert-days=${EXPIRY_ALERT_DAYS:7}
# Project-configured reminder gap used ONLY to hide recently-donated donors in the matching helper.
# It is NOT a medical eligibility rule - blood bank professionals decide eligibility.
lifelink.donation-interval-days=${DONATION_INTERVAL_DAYS:90}
